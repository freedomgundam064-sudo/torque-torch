name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unpack project (newest zip wins)
        run: |
          mkdir -p src
          for z in *.zip; do echo "$(git log -1 --format=%ct -- "$z") $z"; done | sort -n | while read -r t z; do
            echo "Unpacking $z"
            unzip -qo "$z" -d src
          done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: |
          ROOT=$(dirname "$(find src -name settings.gradle.kts -not -path '*/__MACOSX/*' | head -1)")
          cd "$ROOT"
          LOG="$GITHUB_WORKSPACE/build.log"
          set +e
          gradle assembleDebug --console=plain > "$LOG" 2>&1
          STATUS=$?
          tail -5 "$LOG"
          if [ $STATUS -ne 0 ]; then
            echo "=============== ERRORS ==============="
            grep -E '^e: |What went wrong' -A4 "$LOG" | head -60
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: TorqueTorch-APK
          path: src/**/app-debug.apk
