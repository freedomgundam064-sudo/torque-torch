name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: |
          ZIP=$(ls *.zip | head -1)
          echo "Using $ZIP"
          unzip -q "$ZIP" -d src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: |
          ROOT=$(dirname "$(find src -name settings.gradle.kts -not -path '*/__MACOSX/*' | head -1)")
          echo "Project root: $ROOT"
          cd "$ROOT"
          gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: TorqueTorch-APK
          path: src/**/app-debug.apk
